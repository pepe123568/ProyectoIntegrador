<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/inicio" aria-label="Volver">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Agendar Cita</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="contenedor-cita">
    <ion-list lines="none">

      <!-- SERVICIO -->
      <div class="campo-grupo">
        <ion-item class="campo-ionic" [class.invalido]="intentado() && !servicio">
          <ion-select label="Servicio" labelPlacement="stacked" placeholder="Selecciona un servicio"
            [(ngModel)]="servicio" required>
            <ion-select-option value="Consulta general">Consulta general</ion-select-option>
            <ion-select-option value="Vacunación">Vacunación</ion-select-option>
            <ion-select-option value="Desparasitación">Desparasitación</ion-select-option>
            <ion-select-option value="Estética y baño">Estética y baño</ion-select-option>
            <ion-select-option value="Urgencias">Urgencias</ion-select-option>
            <ion-select-option value="Cirugía">Cirugía</ion-select-option>
          </ion-select>
          <ion-text slot="end" class="obligatorio">*</ion-text>
        </ion-item>

        <ion-text class="error-campo" *ngIf="intentado() && !servicio">
          Este campo es obligatorio
        </ion-text>
      </div>

      <!-- FECHA -->
      <div class="campo-grupo">
        <ion-item class="campo-ionic" [class.invalido]="intentado() && !fecha">
          <ion-input label="Fecha" labelPlacement="stacked" type="date" [min]="fechaMinima" [(ngModel)]="fecha"
            required></ion-input>
          <ion-text slot="end" class="obligatorio">*</ion-text>
        </ion-item>

        <ion-text class="error-campo" *ngIf="intentado() && !fecha">
          Este campo es obligatorio
        </ion-text>
      </div>

      <!-- HORA (LIMITADA DE 9:00 AM A 7:00 PM) -->
      <div class="campo-grupo">
        <ion-item class="campo-ionic" [class.invalido]="(intentado() && !hora) || (hora && !esHorarioValido())">
          <ion-input label="Hora (9:00 AM - 7:00 PM)" labelPlacement="stacked" type="time" min="09:00" max="19:00"
            [(ngModel)]="hora" (ionChange)="validarHoraEnVivo()" required></ion-input>
          <ion-text slot="end" class="obligatorio">*</ion-text>
        </ion-item>

        <ion-text class="error-campo" *ngIf="intentado() && !hora">
          Este campo es obligatorio
        </ion-text>

        <ion-text class="error-campo" *ngIf="hora && !esHorarioValido()">
          El horario de atención es de 9:00 AM a 7:00 PM
        </ion-text>
      </div>

      <!-- NOTAS ADICIONALES (OPCIONAL: SIN ASTERISCO) -->
      <div class="campo-grupo">
        <ion-item class="campo-ionic">
          <ion-textarea label="Notas adicionales (opcional)" labelPlacement="stacked" rows="4"
            placeholder="Describe síntomas, raza o indicaciones..." [(ngModel)]="notas"></ion-textarea>
        </ion-item>
      </div>

    </ion-list>

    <!-- ERROR GENERAL (ej. sin sesión o fallo de Firebase) -->
    <ion-text color="danger" *ngIf="error()">
      <p class="error-general">{{ error() }}</p>
    </ion-text>

    <ion-button expand="block" class="btn-confirmar" [disabled]="cargando()" (click)="agendarCita()">
      <ion-spinner *ngIf="cargando()" name="crescent" slot="start"></ion-spinner>
      {{ cargando() ? 'Agendando...' : 'Confirmar Cita' }}
    </ion-button>
  </div>
</ion-content>

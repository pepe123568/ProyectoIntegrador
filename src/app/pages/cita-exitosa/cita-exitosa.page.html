<ion-header>
  <ion-toolbar>
    <ion-title>Confirmación</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ion-text-center">
  <ion-icon name="checkmark-circle" color="success" style="font-size: 84px; margin-top: 24px;"></ion-icon>

  <ion-text>
    <h1>¡Cita agendada con éxito!</h1>
  </ion-text>

  <ion-card class="ion-text-start ion-margin-top">
    <ion-card-header>
      <ion-card-title>Detalles de la cita</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none">
        <ion-item>
          <ion-icon slot="start" name="calendar-outline"></ion-icon>
          <ion-label>{{ fechaFormateada }}</ion-label>
        </ion-item>

        <ion-item>
          <ion-icon slot="start" name="time-outline"></ion-icon>
          <ion-label>{{ horaFormateada }}</ion-label>
        </ion-item>

        <ion-item>
          <ion-icon slot="start" name="medkit-outline"></ion-icon>
          <ion-label>{{ cita.servicio || 'Servicio no disponible' }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" routerLink="/citas" class="ion-margin-top">
    Ver en mis citas
  </ion-button>

  <ion-button expand="block" fill="outline" routerLink="/inicio" class="ion-margin-top">
    Regresar al inicio
  </ion-button>
</ion-content>

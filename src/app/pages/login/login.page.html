<ion-content [fullscreen]="true" class="ion-padding">
  <ion-card class="login-card">
    <ion-card-content>
      <ion-text class="ion-text-center">
        <ion-icon name="paw-outline" color="primary" class="logo-icono"></ion-icon>
        <h1>Kamur</h1>
        <p>Veterinaria</p>
      </ion-text>

      <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
        <ion-list lines="none">
          <ion-item>
            <ion-icon slot="start" name="mail-outline" color="primary"></ion-icon>
            <ion-input
              type="email"
              formControlName="correo"
              placeholder="Correo electrónico"
              autocomplete="email"
              aria-label="Correo electrónico"
            ></ion-input>
          </ion-item>

          <ion-item>
            <ion-icon slot="start" name="lock-closed-outline" color="primary"></ion-icon>
            <ion-input
              [type]="mostrarPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Contraseña"
              autocomplete="current-password"
              aria-label="Contraseña"
            ></ion-input>
            <ion-button
              slot="end"
              fill="clear"
              type="button"
              (click)="cambiarVisibilidad()"
              aria-label="Mostrar u ocultar contraseña"
            >
              <ion-icon
                slot="icon-only"
                [name]="mostrarPassword() ? 'eye-off-outline' : 'eye-outline'"
              ></ion-icon>
            </ion-button>
          </ion-item>
        </ion-list>

        <ion-button
          fill="clear"
          size="small"
          type="button"
          class="ion-float-right"
          (click)="recuperarPassword()"
        >
          ¿Olvidaste tu contraseña?
        </ion-button>

        @if (error()) {
          <ion-text color="danger">
            <p class="ion-text-center">{{ error() }}</p>
          </ion-text>
        }

        @if (mensaje()) {
          <ion-text color="success">
            <p class="ion-text-center">{{ mensaje() }}</p>
          </ion-text>
        }

        <ion-button
          expand="block"
          type="submit"
          class="ion-margin-top"
          [disabled]="loading()"
        >
          @if (loading()) {
            <ion-spinner name="crescent" slot="start"></ion-spinner>
          }
          {{ loading() ? 'Iniciando...' : 'Iniciar sesión' }}
        </ion-button>
      </form>

      <ion-text color="medium" class="ion-text-center">
        <p class="ion-margin-vertical">o continúa con</p>
      </ion-text>

      <ion-button expand="block" fill="outline" type="button" (click)="loginGoogle()">
        <ion-icon slot="start" name="logo-google"></ion-icon>
        Continuar con Google
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        type="button"
        class="ion-margin-top"
        (click)="loginApple()"
      >
        <ion-icon slot="start" name="logo-apple"></ion-icon>
        Continuar con Apple
      </ion-button>

      <ion-text class="ion-text-center">
        <p class="ion-margin-top">
          ¿No tienes cuenta?
          <ion-button fill="clear" size="small" routerLink="/registro">
            Regístrate
          </ion-button>
        </p>
      </ion-text>
    </ion-card-content>
  </ion-card>
</ion-content>

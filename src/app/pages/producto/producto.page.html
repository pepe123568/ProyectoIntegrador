<ion-content>
  <!-- Barra superior -->
  <ion-grid class="topbar">
    <ion-button class="icon-btn" routerLink="/tienda"><ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon></ion-button>
    <ion-text>Producto</ion-text>
    <ion-button class="icon-btn" routerLink="/carrito"><ion-icon name="cart-outline" aria-hidden="true"></ion-icon></ion-button>
  </ion-grid>

  <!-- Información del producto -->
  <ion-grid
    class="mobile-page no-nav"
    *ngIf="datos.productoSeleccionado as p; else vacio">

    <ion-grid class="card">
      <!-- Imagen -->
      <ion-img
        [src]="p.imagen"
        [alt]="p.nombre"
        style="width:100%;height:230px;object-fit:contain;background:var(--green-pale);border-radius:16px"></ion-img>

      <!-- Información -->
      <ion-note class="eyebrow success-text">{{ p.categoria }}</ion-note>
      <ion-text>{{ p.nombre }}</ion-text>
      <ion-grid class="price">${{ p.precio }}.00</ion-grid>

      <!-- Cantidad -->
      <ion-grid class="between" style="margin:18px 0">
        <ion-text>Cantidad</ion-text>

        <ion-grid class="qty">
          <ion-button (click)="cantidad = cantidad > 1 ? cantidad - 1 : 1"><ion-icon name="remove-outline" aria-hidden="true"></ion-icon></ion-button>
          <ion-text>{{ cantidad }}</ion-text>
          <ion-button (click)="cantidad = cantidad + 1">+</ion-button>
        </ion-grid>
      </ion-grid>

      <!-- Botones -->
      <ion-button class="primary" (click)="comprar()">Comprar</ion-button>
      <ion-button class="secondary" (click)="add()">Agregar al carrito</ion-button>

      <!-- Mensaje -->
      <ion-note class="success-text center">{{ mensaje }}</ion-note>

      <!-- Descripción -->
      <ion-text>Descripción</ion-text>
      <ion-note class="muted">{{ p.descripcion }}</ion-note>
    </ion-grid>
  </ion-grid>

  <!-- Se muestra cuando no hay un producto seleccionado -->
  <ng-template #vacio>
    <ion-grid class="mobile-page">
      <ion-button class="primary" routerLink="/tienda">Ver tienda</ion-button>
    </ion-grid>
  </ng-template>
</ion-content>

<!-- eslint-disable @angular-eslint/template/prefer-control-flow -->
<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio" text="" aria-label="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>Nuestras Sucursales</ion-title>
  </ion-toolbar>

  <ion-toolbar class="toolbar-busqueda">
    <ion-searchbar placeholder="Buscar por colonia o ciudad..." (ionInput)="alBuscar($event)"
      [debounce]="200"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div class="sucursales-wrapper">
    <ion-card *ngFor="let sucursal of sucursalesFiltradas()" class="card-sucursal">
      <ion-card-header>
        <div class="header-top">
          <ion-card-subtitle>{{ sucursal.zona }}</ion-card-subtitle>
          <ion-badge [color]="sucursal.abierta ? 'success' : 'medium'">
            {{ sucursal.abierta ? 'Abierta' : 'Cerrada' }}
          </ion-badge>
        </div>
        <ion-card-title>{{ sucursal.nombre }}</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <ion-list lines="none" class="lista-info">
          <ion-item>
            <ion-icon slot="start" name="location-outline"></ion-icon>
            <ion-label class="ion-text-wrap">{{ sucursal.direccion }}</ion-label>
          </ion-item>

          <ion-item>
            <ion-icon slot="start" name="time-outline"></ion-icon>
            <ion-label class="ion-text-wrap">{{ sucursal.horario }}</ion-label>
          </ion-item>

          <ion-item>
            <ion-icon slot="start" name="call-outline"></ion-icon>
            <ion-label>{{ sucursal.telefono }}</ion-label>
          </ion-item>
        </ion-list>

        <ion-grid class="ion-no-padding ion-margin-top">
          <ion-row>
            <ion-col size="6" class="ion-padding-end">
              <ion-button expand="block" fill="outline" class="btn-llamar" [href]="'tel:' + sucursal.telefono">
                <ion-icon slot="start" name="call-outline"></ion-icon>
                Llamar
              </ion-button>
            </ion-col>

            <ion-col size="6">
              <ion-button expand="block" class="btn-mapa" [href]="sucursal.mapsUrl" target="_blank"
                rel="noopener noreferrer">
                <ion-icon slot="start" name="navigate-outline"></ion-icon>
                Cómo llegar
              </ion-button>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-card-content>
    </ion-card>

    <ion-card *ngIf="sucursalesFiltradas().length === 0" class="card-sucursal ion-text-center">
      <ion-card-content>
        <ion-icon name="storefront-outline" class="icono-vacio"></ion-icon>
        <p>No se encontraron sucursales con "{{ terminoBusqueda() }}".</p>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

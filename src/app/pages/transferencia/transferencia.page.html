<ion-content>
  <!-- Barra superior -->
  <ion-grid class="topbar">
    <ion-button class="icon-btn" routerLink="/pago"><ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon></ion-button>
    <ion-text>Transferencia</ion-text>
    <ion-text></ion-text>
  </ion-grid>

  <ion-grid class="mobile-page no-nav">
    <!-- Información de transferencia -->
    <ion-grid class="card center">
      <ion-grid class="list-icon" style="margin:auto"><ion-icon name="swap-horizontal-outline" aria-hidden="true"></ion-icon></ion-grid>
      <ion-text>Realiza tu transferencia</ion-text>
    </ion-grid>

    <!-- Datos bancarios -->
    <ion-grid class="card">
      <ion-grid class="detail-grid">
        <ion-text>CLABE</ion-text>
        <ion-text>0123 4567 8901 2345 67</ion-text>

        <ion-text>Titular</ion-text>
        <ion-text>Vet-Kamur</ion-text>

        <ion-text>Banco</ion-text>
        <ion-text>Banco Demo</ion-text>

        <ion-text>Total</ion-text>
        <ion-text>${{ datos.total() }}.00</ion-text>
      </ion-grid>

      <ion-button class="secondary" (click)="copiar()">Copiar número</ion-button>

      <ion-note class="success-text center" *ngIf="copiado">
        Número copiado.
      </ion-note>
    </ion-grid>

    <!-- Comprobante -->
    <ion-grid class="field-wrap">
      <ion-label>Comprobante</ion-label>
      <input
        class="field"
        type="file"
        accept="image/*,.pdf"
        (change)="archivoSel($event)">
      <ion-text class="tiny" *ngIf="archivo">{{ archivo }}</ion-text>
    </ion-grid>

    <!-- Mensaje de error -->
    <ion-note class="error">{{ error }}</ion-note>

    <!-- Botones -->
    <ion-button class="primary" (click)="confirmar()">Confirmar pago</ion-button>
    <ion-button class="secondary" routerLink="/pago">Regresar</ion-button>
  </ion-grid>
</ion-content>
